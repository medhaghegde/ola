<style>
    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-weight: bolder;
    }
    #navbar{
        height: 70px;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        background-color: rgb(241, 236, 236);
        box-shadow: inset 0px 0px 10px 0px rgb(204, 195, 195);
    }
    .container{
        height: 100vh;
        display: flex;
        justify-content: space-evenly;
        align-items: center;
        flex-direction: row;
        gap:30px;
    }
    .boxes{
        width: 80vh;
        border: 20px;       
        background-color: rgb(241, 236, 236);       
        border-radius: 20px;
        box-shadow:inset 0px 0px 10px 0px rgb(204, 195, 195);
    }
    
    .boxes div{
        
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
    }
    #box1 img{
        height: 250px;
        width: 250px;
    }
    input{
        width: 300px;
        padding: 10px;
        border-radius: 20px;
        border: none;
    }
    button{
        padding: 5px 10px;
        border-radius: 20px;
        border: 1px solid black;
        background-color: rgb(241, 236, 236);
        color: yellowgreen;
        width: 200px;
        transition: all 0.3s;
    }
    button:hover{
        background-color: yellowgreen;
        color: black;
        cursor: pointer;
    }

    
</style>
